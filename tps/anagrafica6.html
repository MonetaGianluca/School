<!DOCTYPE html>
<html>
    <head>
        <title>anagrafica 6</title>
    </head>
        <script>
            function salvaDati(){
                let person = {};
                person.nome=document.getElementById("nome").value;
                person.cognome=document.getElementById("cognome").value;
                person.cap=document.getElementById("cap").value;
                person.mail=document.getElementById("mail").value;
                person.cfiscale=document.getElementById("cfiscale").value;

                let nomeregex="^[A-Za-zÀ-ÖØ-öø-ÿ' ]+$";
                let capregex="^\d{5}$";
                let mailregex="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$";
                let cfiscregex="^[A-Z]{6}[0-9]{2}[A-Z][0-9]{2}[A-Z][0-9]{3}[A-Z]$";

                if (!nomeregex.test(person.nome)){
                    alert("nome non valido");
                }
                if (!nomeregex.test(person.cognome)){
                    alert("cognome non valido");
                }
                if (!capregex.test(person.cap)){
                    alert("cap non valido");
                }
                if (!mailregex.test(person.mail)){
                    alert("email non valida");
                }
                if (!cfiscregex.test(person.cfiscale)){
                    alert("codice fiscale non valido");
                }

                localStorage.setItem("Persona", JSON.stringify(person));
                
            }
        </script>
    <body>
        <p>nome</p>
        <input type="text" id="nome">

        <p>cognome</p>
        <input type="text" id="cognome">
        
        <p>cap</p>
        <input type="text" id="cap">

        <p>mail</p>
        <input type="text" id="mail">

        <p>codice fiscale</p>
        <input type="text" id="cfiscale">

        <br>

        <input type="button" value="salva" onclick="salvaDati()">
    </body>
</html>
