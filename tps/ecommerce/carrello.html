<!DOCTYPE html>
<html>
    <head>
        <title>E-Commerce Carrello</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="barraMenu">
            <div id="logoSito">
                <img src="./LogoFireZero.png" alt="">
                <span class="nomeSito">FireZero</span>
            </div>
            <a href="./index.html">home</a>
            <a href="./registrazione.html">registrazione</a>
        </div>
        <div id="sezioneCarrello"></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script>
            const sezioneCarrello = document.getElementById("sezioneCarrello");
            // Recupera prodotti
            let carrello = JSON.parse(localStorage.getItem("carrello")) || [];
            // Carrello vuoto
            if(carrello.length === 0){
                sezioneCarrello.innerHTML = `
                    <h2 class="carrelloVuoto">
                        Il carrello è vuoto
                    </h2>
                `;
            }
            let totale = 0;
            // Genera prodotti
            carrello.forEach((prodotto, indice) => {
                totale += parseFloat(prodotto.prezzo);
                const box = document.createElement("div");
                box.classList.add("boxCarrello");
                box.innerHTML = `
                    <img src="${prodotto.immagine}">
                    <div class="infoCarrello">
                        <h2>${prodotto.nome}</h2>
                        <h3>${prodotto.marca}</h3>
                        <p>${prodotto.descrizione}</p>
                        <div class="prezzoCarrello">
                            € ${prodotto.prezzo}
                        </div>
                        <button onclick="rimuoviProdotto(${indice})">
                            Rimuovi
                        </button>
                    </div>
                `;
                sezioneCarrello.appendChild(box);
            });
            // Totale
            const totaleBox = document.createElement("div");
            totaleBox.classList.add("totaleCarrello");
            totaleBox.innerHTML = `
                Totale: € ${totale.toFixed(2)}
            `;
            sezioneCarrello.appendChild(totaleBox);
            const checkoutBtn = document.createElement("button");
            checkoutBtn.classList.add("checkoutBtn");
            checkoutBtn.textContent = "Checkout";
            checkoutBtn.addEventListener("click", generaPDF);
            sezioneCarrello.appendChild(checkoutBtn);
            // Rimuove prodotto
            function rimuoviProdotto(indice){
                carrello.splice(indice, 1);
                localStorage.setItem(
                    "carrello",
                    JSON.stringify(carrello)
                );
                location.reload();
            }
            function generaPDF(){
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                // Titolo
                doc.setFontSize(22);
                doc.text("Ricevuta FireZero", 20, 20);
                doc.setFontSize(12);
                let y = 40;
                let totale = 0;
                // Prodotti
                carrello.forEach((prodotto, index) => {
                    doc.text(
                        `${index + 1}. ${prodotto.nome}`,
                        20,
                        y
                    );
                    y += 8;
                    doc.text(
                        `Marca: ${prodotto.marca}`,
                        25,
                        y
                    );
                    y += 8;
                    doc.text(
                        `Prezzo: € ${prodotto.prezzo}`,
                        25,
                        y
                    );
                    y += 15;
                    totale += parseFloat(prodotto.prezzo);
                });
                // Totale
                doc.setFontSize(18);
                doc.text(
                    `Totale: € ${totale.toFixed(2)}`,
                    20,
                    y + 10
                );
                // Data
                doc.setFontSize(11);
                doc.text(
                    `Data: ${new Date().toLocaleDateString()}`,
                    20,
                    y + 25
                );
                // Download PDF
                doc.save("ricevuta_firezero.pdf");
                // Svuota carrello
                localStorage.removeItem("carrello");
                // Aggiorna pagina
                setTimeout(() => {
                    location.reload();
                }, 500)
            }
        </script>
        
    </body>
</html>
