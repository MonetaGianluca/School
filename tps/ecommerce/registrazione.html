<!DOCTYPE html>
<html>
<head>
    <title>FireZero Registrazione</title>
    <link rel="stylesheet" href="style.css">
    <script>
        const form = document.getElementById("formRegistrazione");
    
        form.addEventListener("submit", function(event) {
            event.preventDefault();
    
            let valido = true;
    

            const nome = document.getElementById("nome");
            const cognome = document.getElementById("cognome");
            const indirizzo = document.getElementById("indirizzo");
            const cap = document.getElementById("cap");
            const email = document.getElementById("email");
            const password = document.getElementById("password");

            const regexNome = /^[A-Za-zÀ-ÿ\s]{2,}$/;
            const regexIndirizzo = /^[A-Za-z0-9À-ÿ\s,.]{5,}$/;
            const regexCAP = /^[0-9]{5}$/;
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const regexPassword = /^(?=.*[A-Z])(?=.*[0-9]).{8,}$/;
    
            // Reset errori
            document.querySelectorAll(".errore").forEach(el => el.textContent = "");
    

            if (!regexNome.test(nome.value)) {
                mostraErrore(nome, "Nome non valido");
                valido = false;
            }
    
            if (!regexNome.test(cognome.value)) {
                mostraErrore(cognome, "Cognome non valido");
                valido = false;
            }
    
            if (!regexIndirizzo.test(indirizzo.value)) {
                mostraErrore(indirizzo, "Indirizzo non valido");
                valido = false;
            }
    
            if (!regexCAP.test(cap.value)) {
                mostraErrore(cap, "Il CAP deve contenere 5 cifre");
                valido = false;
            }
    
            if (!regexEmail.test(email.value)) {
                mostraErrore(email, "E-mail non valida");
                valido = false;
            }
    
            if (!regexPassword.test(password.value)) {
                mostraErrore(
                    password,
                    "Minimo 8 caratteri, 1 numero e 1 maiuscola"
                );
                valido = false;
            }
    
            if (valido) {
            

                const utente = {
                    nome: nome.value,
                    cognome: cognome.value,
                    indirizzo: indirizzo.value,
                    cap: cap.value,
                    email: email.value,
                    password: password.value
                };
            

                localStorage.setItem("utenteRegistrato", JSON.stringify(utente));
            
                console.log(utente);
            
                alert("Registrazione completata!");
            
                form.reset();
            }
        });
    
        function mostraErrore(input, messaggio) {
            input.nextElementSibling.textContent = messaggio;
        }
    </script>
</head>
<body>
    <div id="barraMenu">
        <div id="logoSito">
            <img src="./LogoFireZero.png" alt="">
            <span class="nomeSito">FireZero</span>
        </div>
        <a href="./index.html">home</a>
        <a href="./carrello.html">carrello</a>
    </div>
    <div id="sezioneLogin">
        <form id="formRegistrazione">
            <h2>Registrazione</h2>
    
            <label>Nome</label>
            <input type="text" id="nome" placeholder="Inserisci il nome">
            <small class="errore"></small>
    
            <label>Cognome</label>
            <input type="text" id="cognome" placeholder="Inserisci il cognome">
            <small class="errore"></small>
    
            <label>Indirizzo</label>
            <input type="text" id="indirizzo" placeholder="Inserisci l'indirizzo">
            <small class="errore"></small>
    
            <label>CAP</label>
            <input type="text" id="cap" placeholder="Es: 20100">
            <small class="errore"></small>
    
            <label>E-mail</label>
            <input type="email" id="email" placeholder="Inserisci la e-mail">
            <small class="errore"></small>
    
            <label>Password</label>
            <input type="password" id="password" placeholder="Inserisci la password">
            <small class="errore"></small>
    
            <button type="submit">Registrati</button>
        </form>
    </div>
</body>
</html>
