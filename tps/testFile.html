<html>

<body>

  <h2>carica file</h2>

  <input type="file" id="fileInput" accept=".csv">
  <pre id="output"></pre>

  <script>
    const fileInput = document.getElementById("fileInput");
    const output = document.getElementById("output");

    fileInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      });

  </script>

</body>
